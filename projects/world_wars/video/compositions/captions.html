<div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="1184.137">
<div id="cap0" class="clip cap ca" data-start="0.000" data-duration="2.234" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — екі соғыс туралы әңгіме.</div></div>
<div id="cap1" class="clip cap ca" data-start="2.234" data-duration="3.701" data-track-index="2"><div class="cap-in"><b>Ата:</b> Адамзат тарихындағы ең ауыр екі соғыс туралы.</div></div>
<div id="cap2" class="clip cap ca" data-start="7.035" data-duration="4.386" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қысқы түн. Даладағы киіз үйде ата мен немересі отыр.</div></div>
<div id="cap3" class="clip cap ce" data-start="12.521" data-duration="4.508" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, мына ескі сурет кімдікі? Үстінде әскери киім бар екен.</div></div>
<div id="cap4" class="clip cap ca" data-start="17.429" data-duration="2.301" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — менің әкем, сенің бабаң.</div></div>
<div id="cap5" class="clip cap ca" data-start="19.730" data-duration="3.187" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ол соғысқа кетті де, қайтып оралмады.</div></div>
<div id="cap6" class="clip cap ce" data-start="23.317" data-duration="0.865" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Қай соғысқа?</div></div>
<div id="cap7" class="clip cap ce" data-start="24.182" data-duration="4.100" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Бірінші дүниежүзілік соғысқа ма, әлде Екіншісіне ме?</div></div>
<div id="cap8" class="clip cap ca" data-start="28.682" data-duration="1.092" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екіншісіне, балам.</div></div>
<div id="cap9" class="clip cap ca" data-start="29.774" data-duration="3.382" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ал Бірінші соғыс одан жиырма бес жыл бұрын болған.</div></div>
<div id="cap10" class="clip cap ce" data-start="33.556" data-duration="3.257" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ал екеуінің айырмашылығы қандай? Кім жеңді?</div></div>
<div id="cap11" class="clip cap ce" data-start="36.813" data-duration="2.016" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Қанша адам қаза тапты?</div></div>
<div id="cap12" class="clip cap ce" data-start="39.229" data-duration="3.751" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Қазақтар да соғысты ма? Олардың қаншасы оралмады?</div></div>
<div id="cap13" class="clip cap ca" data-start="43.380" data-duration="2.141" data-track-index="2"><div class="cap-in"><b>Ата:</b> Жақсы сұрақтар. Отыр, балам.</div></div>
<div id="cap14" class="clip cap ca" data-start="45.521" data-duration="4.327" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бүгін бәрін ретімен, жылымен, санымен айтып берейін.</div></div>
<div id="cap15" class="clip cap ca" data-start="50.948" data-duration="3.979" data-track-index="2"><div class="cap-in"><b>Ата:</b> Алдымен Бірінші соғыс, сосын қазақ даласындағы 1916 жыл,</div></div>
<div id="cap16" class="clip cap ca" data-start="54.927" data-duration="2.126" data-track-index="2"><div class="cap-in"><b>Ата:</b> содан кейін Екінші соғыс.</div></div>
<div id="cap17" class="clip cap ca" data-start="57.453" data-duration="3.146" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ең соңында екі соғысты қатар қойып салыстырамыз.</div></div>
<div id="cap18" class="clip cap ca" data-start="68.899" data-duration="2.632" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сонымен, Бірінші дүниежүзілік соғыс.</div></div>
<div id="cap19" class="clip cap ca" data-start="72.631" data-duration="4.564" data-track-index="2"><div class="cap-in"><b>Ата:</b> Жүз жыл бұрын Еуропада бірнеше үлкен империя болды.</div></div>
<div id="cap20" class="clip cap ca" data-start="77.195" data-duration="5.362" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олар бір-бірімен жер, теңіз және ықпал үшін бәсекелесті.</div></div>
<div id="cap21" class="clip cap ca" data-start="82.957" data-duration="3.246" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олар бір-бірінен қорқып, екі үлкен одаққа бөлінді.</div></div>
<div id="cap22" class="clip cap ca" data-start="86.203" data-duration="2.623" data-track-index="2"><div class="cap-in"><b>Ата:</b> Әр ел қару жинап, әскерін көбейтті.</div></div>
<div id="cap23" class="clip cap ce" data-start="89.226" data-duration="3.438" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Яғни соғыс басталмас бұрын-ақ бәрі дайын тұрған ғой?</div></div>
<div id="cap24" class="clip cap ca" data-start="93.064" data-duration="3.789" data-track-index="2"><div class="cap-in"><b>Ата:</b> Дәл солай. Тек бір ұшқын ғана жетпей тұрды.</div></div>
<div id="cap25" class="clip cap ca" data-start="97.953" data-duration="6.215" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1914 жылы 28 маусымда Сараево қаласында Австрия-Венгрия тағының мұрагері</div></div>
<div id="cap26" class="clip cap ca" data-start="104.168" data-duration="2.594" data-track-index="2"><div class="cap-in"><b>Ата:</b> Франц Фердинанд өлтірілді.</div></div>
<div id="cap27" class="clip cap ca" data-start="107.162" data-duration="5.649" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бір айдан кейін, 28 шілдеде, Австрия-Венгрия Сербияға соғыс жариялады.</div></div>
<div id="cap28" class="clip cap ca" data-start="113.211" data-duration="4.863" data-track-index="2"><div class="cap-in"><b>Ата:</b> Оны он тоғыз жасар серб жігіті Гаврило Принцип атып өлтірді.</div></div>
<div id="cap29" class="clip cap ca" data-start="119.174" data-duration="3.416" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сосын одақтар бірінен соң бірі соғысқа кірді.</div></div>
<div id="cap30" class="clip cap ca" data-start="122.590" data-duration="4.526" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бір жағында — Антанта: Ресей, Франция және Ұлыбритания.</div></div>
<div id="cap31" class="clip cap ca" data-start="127.516" data-duration="7.852" data-track-index="2"><div class="cap-in"><b>Ата:</b> Кейін оларға 1915 жылы Италия, ал 1917 жылы Америка Құрама Штаттары қосылды.</div></div>
<div id="cap32" class="clip cap ca" data-start="135.768" data-duration="4.981" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екінші жағында — Орталық державалар: Германия, Австрия-Венгрия,</div></div>
<div id="cap33" class="clip cap ca" data-start="140.749" data-duration="2.722" data-track-index="2"><div class="cap-in"><b>Ата:</b> Осман империясы және Болгария.</div></div>
<div id="cap34" class="clip cap ca" data-start="143.871" data-duration="3.377" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1 тамызда Германия Ресейге соғыс жариялады.</div></div>
<div id="cap35" class="clip cap ca" data-start="147.248" data-duration="6.083" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ұлыбритания Германия Бельгияға басып кірген соң, 4 тамызда соғысқа кірді.</div></div>
<div id="cap36" class="clip cap ca" data-start="154.431" data-duration="2.733" data-track-index="2"><div class="cap-in"><b>Ата:</b> Миллиондаған жас жігіт әскерге алынды.</div></div>
<div id="cap37" class="clip cap ca" data-start="157.164" data-duration="3.370" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олар соғыс бірнеше айда бітеді деп ойлады.</div></div>
<div id="cap38" class="clip cap ca" data-start="160.934" data-duration="2.504" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бірақ соғыс төрт жылдан астам созылды.</div></div>
<div id="cap39" class="clip cap ca" data-start="164.538" data-duration="3.772" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1914 жылы күзде неміс әскері Парижге жақындады.</div></div>
<div id="cap40" class="clip cap ca" data-start="168.310" data-duration="5.808" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бірақ Марна өзенінің бойында француздар мен ағылшындар оны тоқтатты.</div></div>
<div id="cap41" class="clip cap ca" data-start="174.518" data-duration="4.702" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ал шығыста орыс әскері Германия мен Австрия-Венгрияға қарсы соғысты.</div></div>
<div id="cap42" class="clip cap ca" data-start="179.220" data-duration="3.877" data-track-index="2"><div class="cap-in"><b>Ата:</b> Майдан Балтық теңізінен Қара теңізге дейін созылды.</div></div>
<div id="cap43" class="clip cap ca" data-start="183.497" data-duration="6.059" data-track-index="2"><div class="cap-in"><b>Ата:</b> Оңтүстікте Осман империясы Галлиполиде одақтастардың теңіз десантын тоқтатты.</div></div>
<div id="cap44" class="clip cap ca" data-start="197.856" data-duration="5.520" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бірінші соғыстың басты белгісі — окоп, яғни жер қазып жасалған ұзын ор.</div></div>
<div id="cap45" class="clip cap ca" data-start="203.776" data-duration="4.048" data-track-index="2"><div class="cap-in"><b>Ата:</b> Батыс майданда екі әскер жүздеген шақырымға созылған орлар қазып,</div></div>
<div id="cap46" class="clip cap ca" data-start="207.824" data-duration="1.845" data-track-index="2"><div class="cap-in"><b>Ата:</b> бір-біріне қарсы отырды.</div></div>
<div id="cap47" class="clip cap ce" data-start="210.069" data-duration="2.441" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, неге олар алға жүре алмады?</div></div>
<div id="cap48" class="clip cap ca" data-start="212.910" data-duration="3.763" data-track-index="2"><div class="cap-in"><b>Ата:</b> Себебі екі ордың ортасында тікенек сым мен пулемет тұрды.</div></div>
<div id="cap49" class="clip cap ca" data-start="216.673" data-duration="2.595" data-track-index="2"><div class="cap-in"><b>Ата:</b> Алға шыққан адам бірден оққа ұшты.</div></div>
<div id="cap50" class="clip cap ca" data-start="219.668" data-duration="4.909" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сарбаздар жылдар бойы суық, батпақ пен егеуқұйрықтың ортасында өмір сүрді.</div></div>
<div id="cap51" class="clip cap ca" data-start="225.677" data-duration="4.350" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл соғыста адамзат жаңа қаруларды алғаш рет көп қолданды.</div></div>
<div id="cap52" class="clip cap ca" data-start="230.427" data-duration="4.409" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1915 жылы Ипр қаласының маңында улы газ қолданылды.</div></div>
<div id="cap53" class="clip cap ca" data-start="234.836" data-duration="3.636" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сарбаздар газқағар киюге мәжбүр болды.</div></div>
<div id="cap54" class="clip cap ca" data-start="239.572" data-duration="4.334" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1916 жылы Сомма шайқасында алғаш рет танк шықты.</div></div>
<div id="cap55" class="clip cap ca" data-start="243.906" data-duration="4.233" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ол баяу, ауыр, бірақ орды кесіп өте алатын.</div></div>
<div id="cap56" class="clip cap ca" data-start="248.539" data-duration="2.169" data-track-index="2"><div class="cap-in"><b>Ата:</b> Аспанда алғашқы ұшақтар ұшты.</div></div>
<div id="cap57" class="clip cap ca" data-start="250.708" data-duration="3.117" data-track-index="2"><div class="cap-in"><b>Ата:</b> Әуелі барлау үшін, кейін соғысу үшін.</div></div>
<div id="cap58" class="clip cap ca" data-start="254.925" data-duration="4.375" data-track-index="2"><div class="cap-in"><b>Ата:</b> Верден шайқасының өзінде шамамен үш жүз мың адам қаза тапты.</div></div>
<div id="cap59" class="clip cap ca" data-start="259.300" data-duration="2.100" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл бір ғана шайқас еді.</div></div>
<div id="cap60" class="clip cap ce" data-start="261.800" data-duration="2.776" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Үш жүз мың... Бұл тұтас бір қаланың халқы ғой.</div></div>
<div id="cap61" class="clip cap ca" data-start="264.976" data-duration="0.809" data-track-index="2"><div class="cap-in"><b>Ата:</b> Иә, балам.</div></div>
<div id="cap62" class="clip cap ca" data-start="265.785" data-duration="4.475" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сондықтан бұл соғысты кейін «ет тартқыш» деп атады.</div></div>
<div id="cap63" class="clip cap ca" data-start="271.360" data-duration="4.242" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сол жылы шығыста орыс генералы Брусилов үлкен шабуыл жасап,</div></div>

<div id="cap148" class="clip cap ca" data-start="655.609" data-duration="4.174" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ленинград қаласы 872 күн бойы жау қоршауында қалды.</div></div>
<div id="cap149" class="clip cap ca" data-start="660.183" data-duration="1.498" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қалада нан таусылды.</div></div>
<div id="cap150" class="clip cap ca" data-start="661.681" data-duration="4.695" data-track-index="2"><div class="cap-in"><b>Ата:</b> Шамамен бір миллионға жуық тұрғын, көбі аштан, қаза тапты.</div></div>
<div id="cap151" class="clip cap ca" data-start="667.476" data-duration="4.783" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сол кезде қазақтың ұлы ақыны Жамбыл Жабаев «Ленинградтық өренім» деген өлең</div></div>
<div id="cap152" class="clip cap ca" data-start="672.259" data-duration="0.733" data-track-index="2"><div class="cap-in"><b>Ата:</b> жазды.</div></div>
<div id="cap153" class="clip cap ca" data-start="673.392" data-duration="4.522" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл өлең қоршаудағы қаланың көшелерінде оқылып, адамдарға күш берді.</div></div>
<div id="cap154" class="clip cap ca" data-start="679.014" data-duration="3.770" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1945 жылы көктемде Кеңес әскері Берлинге кірді.</div></div>
<div id="cap155" class="clip cap ca" data-start="682.784" data-duration="3.077" data-track-index="2"><div class="cap-in"><b>Ата:</b> Рейхстаг үстіне Жеңіс туы тігілді.</div></div>
<div id="cap156" class="clip cap ca" data-start="686.961" data-duration="5.261" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1945 жылы 9 мамырда Германияның берілгені жарияланды.</div></div>
<div id="cap157" class="clip cap ca" data-start="692.222" data-duration="2.037" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — Жеңіс күні.</div></div>
<div id="cap158" class="clip cap ce" data-start="694.659" data-duration="1.894" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ал соғыс сонымен бітті ме?</div></div>
<div id="cap159" class="clip cap ca" data-start="697.653" data-duration="2.906" data-track-index="2"><div class="cap-in"><b>Ата:</b> Жоқ. Жапония әлі соғысып жатты.</div></div>
<div id="cap160" class="clip cap ca" data-start="700.559" data-duration="7.098" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1945 жылы тамызда Америка Хиросима мен Нагасакиге атом бомбасын тастады.</div></div>
<div id="cap161" class="clip cap ca" data-start="708.057" data-duration="2.600" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екі қалада жүз мыңдаған адам қаза тапты.</div></div>
<div id="cap162" class="clip cap ca" data-start="710.658" data-duration="2.950" data-track-index="2"><div class="cap-in"><b>Ата:</b> Адамзат мұндай қаруды бірінші рет көрді.</div></div>
<div id="cap163" class="clip cap ca" data-start="714.708" data-duration="3.239" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1945 жылы 2 қыркүйекте Жапония берілді.</div></div>
<div id="cap164" class="clip cap ca" data-start="717.947" data-duration="3.755" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екінші дүниежүзілік соғыс толық аяқталды.</div></div>
<div id="cap165" class="clip cap ce" data-start="730.002" data-duration="2.091" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Сонда бұл жолы кім жеңді?</div></div>
<div id="cap166" class="clip cap ca" data-start="732.493" data-duration="3.739" data-track-index="2"><div class="cap-in"><b>Ата:</b> Одақтастар жеңді: Кеңес Одағы, Америка, Ұлыбритания,</div></div>
<div id="cap167" class="clip cap ca" data-start="736.232" data-duration="3.227" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қытай және олармен бірге соғысқан елдер.</div></div>
<div id="cap168" class="clip cap ca" data-start="740.559" data-duration="4.980" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл соғыста шамамен 70 миллионнан 85 миллионға дейін адам қаза тапты.</div></div>
<div id="cap169" class="clip cap ca" data-start="745.939" data-duration="4.848" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — сол кездегі жер бетіндегі барлық адамның шамамен үш пайызы.</div></div>
<div id="cap170" class="clip cap ce" data-start="751.187" data-duration="2.277" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Бірінші соғыстан неше есе көп?</div></div>
<div id="cap171" class="clip cap ca" data-start="754.564" data-duration="1.693" data-track-index="2"><div class="cap-in"><b>Ата:</b> Шамамен төрт есе көп.</div></div>
<div id="cap172" class="clip cap ca" data-start="756.257" data-duration="3.735" data-track-index="2"><div class="cap-in"><b>Ата:</b> Әр бір кішкентай сұлба — бір миллион адам.</div></div>
<div id="cap173" class="clip cap ca" data-start="760.392" data-duration="5.090" data-track-index="2"><div class="cap-in"><b>Ата:</b> Тағы бір үлкен айырмашылық бар: бұл жолы қаза тапқандардың көбі сарбаз емес,</div></div>
<div id="cap174" class="clip cap ca" data-start="765.482" data-duration="1.623" data-track-index="2"><div class="cap-in"><b>Ата:</b> бейбіт халық болды.</div></div>
<div id="cap175" class="clip cap ca" data-start="767.505" data-duration="3.664" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бомбаланған қалалар, аштық, лагерьлер, қуғын-сүргін</div></div>
<div id="cap176" class="clip cap ca" data-start="771.169" data-duration="2.865" data-track-index="2"><div class="cap-in"><b>Ата:</b> — соғыс үйдегі адамдарды да аямады.</div></div>
<div id="cap177" class="clip cap ca" data-start="775.134" data-duration="4.209" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ең көп шығынды Кеңес Одағы көрді: шамамен 27 миллион адам.</div></div>
<div id="cap178" class="clip cap ca" data-start="779.743" data-duration="5.144" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ол кездегі кеңес елдерінің әрбір отбасынан дерлік біреу соғыстан оралмады.</div></div>
<div id="cap179" class="clip cap ca" data-start="785.987" data-duration="2.275" data-track-index="2"><div class="cap-in"><b>Ата:</b> Соғыстан кейін, 1945 жылы күзде,</div></div>
<div id="cap180" class="clip cap ca" data-start="788.262" data-duration="4.829" data-track-index="2"><div class="cap-in"><b>Ата:</b> мұндай қасірет қайталанбасын деп Біріккен Ұлттар Ұйымы құрылды.</div></div>
<div id="cap181" class="clip cap ce" data-start="801.391" data-duration="3.849" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, ал біздің бабамыз сияқты қанша қазақстандық соғысқа барды?</div></div>
<div id="cap182" class="clip cap ca" data-start="806.340" data-duration="4.264" data-track-index="2"><div class="cap-in"><b>Ата:</b> Соғыс басталғанда Қазақстанда шамамен алты миллион адам тұратын.</div></div>
<div id="cap183" class="clip cap ca" data-start="811.704" data-duration="4.512" data-track-index="2"><div class="cap-in"><b>Ата:</b> Солардың ішінен майданға шамамен 1 миллион 200 мың адам аттанды.</div></div>
<div id="cap184" class="clip cap ca" data-start="816.616" data-duration="3.561" data-track-index="2"><div class="cap-in"><b>Ата:</b> Вокзалдарда аналар ұлдарын, әйелдер күйеулерін,</div></div>
<div id="cap185" class="clip cap ca" data-start="820.177" data-duration="2.699" data-track-index="2"><div class="cap-in"><b>Ата:</b> балалар әкелерін шығарып салды.</div></div>
<div id="cap186" class="clip cap ca" data-start="823.976" data-duration="1.662" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бір миллион екі жүз мың.</div></div>
<div id="cap187" class="clip cap ca" data-start="825.638" data-duration="3.467" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — Қазақстан халқының әрбір бесінші адамы.</div></div>
<div id="cap188" class="clip cap ca" data-start="830.205" data-duration="3.458" data-track-index="2"><div class="cap-in"><b>Ата:</b> Солардың алты жүз мыңнан астамы елге оралмады.</div></div>
<div id="cap189" class="clip cap ca" data-start="834.763" data-duration="4.594" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ал екі жүз жетпіс бір мыңнан астамы әлі күнге дейін хабарсыз кеткен болып</div></div>
<div id="cap190" class="clip cap ca" data-start="839.357" data-duration="0.916" data-track-index="2"><div class="cap-in"><b>Ата:</b> саналады.</div></div>

<div id="cap192" class="clip cap ca" data-start="843.394" data-duration="3.694" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл — қайда, қалай қаза тапқаны белгісіз адамдар.</div></div>
<div id="cap193" class="clip cap ca" data-start="847.088" data-duration="4.271" data-track-index="2"><div class="cap-in"><b>Ата:</b> Отбасы оларды жылдар бойы күтті. Біздің үй де күтті.</div></div>
<div id="cap194" class="clip cap ca" data-start="852.459" data-duration="4.789" data-track-index="2"><div class="cap-in"><b>Ата:</b> 1941 жылы Алматыда 316-атқыштар дивизиясы құрылды.</div></div>
<div id="cap195" class="clip cap ca" data-start="857.248" data-duration="3.702" data-track-index="2"><div class="cap-in"><b>Ата:</b> Оны генерал Иван Панфилов басқарды.</div></div>
<div id="cap196" class="clip cap ca" data-start="861.350" data-duration="5.720" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бұл дивизия Мәскеу түбінде жауды тоқтатып, астананы қорғауға үлкен үлес қосты.</div></div>
<div id="cap197" class="clip cap ca" data-start="868.170" data-duration="3.941" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сол дивизиядағы батальон командирі — Бауыржан Момышұлы.</div></div>
<div id="cap198" class="clip cap ca" data-start="872.111" data-duration="3.359" data-track-index="2"><div class="cap-in"><b>Ата:</b> Оның ерлігі туралы кейін бүкіл әлем білді.</div></div>
<div id="cap199" class="clip cap ca" data-start="876.570" data-duration="2.497" data-track-index="2"><div class="cap-in"><b>Ата:</b> Әлия Молдағұлова — мерген қыз.</div></div>
<div id="cap200" class="clip cap ca" data-start="879.067" data-duration="3.512" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ол небәрі он сегіз жасында қаза тапты.</div></div>
<div id="cap201" class="clip cap ca" data-start="883.679" data-duration="2.493" data-track-index="2"><div class="cap-in"><b>Ата:</b> Мәншүк Мәметова — пулеметші қыз.</div></div>
<div id="cap202" class="clip cap ca" data-start="886.172" data-duration="6.194" data-track-index="2"><div class="cap-in"><b>Ата:</b> Әлия мен Мәншүк — Кеңес Одағының Батыры атағын алған алғашқы қазақ қыздары.</div></div>
<div id="cap203" class="clip cap ca" data-start="893.466" data-duration="1.990" data-track-index="2"><div class="cap-in"><b>Ата:</b> Талғат Бигелдинов — ұшқыш.</div></div>
<div id="cap204" class="clip cap ca" data-start="895.456" data-duration="3.565" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ол екі мәрте Кеңес Одағының Батыры атанды.</div></div>
<div id="cap205" class="clip cap ca" data-start="900.121" data-duration="1.711" data-track-index="2"><div class="cap-in"><b>Ата:</b> Нүркен Әбдіров — ұшқыш.</div></div>
<div id="cap206" class="clip cap ca" data-start="901.832" data-duration="4.812" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ұшағы оқ тиіп жанғанда, ол оны жаудың техникасына бағыттады.</div></div>
<div id="cap207" class="clip cap ca" data-start="907.744" data-duration="5.355" data-track-index="2"><div class="cap-in"><b>Ата:</b> Рақымжан Қошқарбаев — Берлинде Рейхстагқа алғашқы туларды тіккендердің бірі.</div></div>
<div id="cap208" class="clip cap ca" data-start="914.199" data-duration="4.803" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қазақстандықтардың шамамен бес жүзі Кеңес Одағының Батыры атағын алды.</div></div>
<div id="cap209" class="clip cap ca" data-start="919.002" data-duration="2.545" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олардың шамамен жүзі — қазақтар.</div></div>
<div id="cap210" class="clip cap ca" data-start="922.647" data-duration="4.543" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ал тылда, яғни елде, әйелдер, қарттар мен балалар зауытта, кенішта,</div></div>
<div id="cap211" class="clip cap ca" data-start="927.190" data-duration="2.927" data-track-index="2"><div class="cap-in"><b>Ата:</b> егістікте түнгі-күндізгі жұмыс істеді.</div></div>
<div id="cap212" class="clip cap ca" data-start="930.517" data-duration="4.847" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олар майданды нанмен, етпен, көмірмен, қару-жарақпен қамтамасыз етті.</div></div>
<div id="cap213" class="clip cap ca" data-start="935.764" data-duration="4.513" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қазақстан басқа өңірлерден көшірілген жүз мыңдаған адамды, зауыттарды,</div></div>
<div id="cap214" class="clip cap ca" data-start="940.277" data-duration="1.639" data-track-index="2"><div class="cap-in"><b>Ата:</b> балаларды қабылдады.</div></div>
<div id="cap215" class="clip cap ca" data-start="942.316" data-duration="5.242" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сонымен бірге Қазақстанға өз жерінен күшпен көшірілген халықтар әкелінді:</div></div>
<div id="cap216" class="clip cap ca" data-start="947.558" data-duration="3.437" data-track-index="2"><div class="cap-in"><b>Ата:</b> немістер, шешендер, ингуштар және басқалар.</div></div>
<div id="cap217" class="clip cap ca" data-start="951.395" data-duration="2.974" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олардың алдында корейлер де жер аударылған еді.</div></div>
<div id="cap218" class="clip cap ca" data-start="954.369" data-duration="3.640" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қазақ халқы өзі аш отырса да, олармен нанын бөлісті.</div></div>
<div id="cap219" class="clip cap ca" data-start="958.409" data-duration="5.142" data-track-index="2"><div class="cap-in"><b>Ата:</b> Шымкенттің қорғасын зауыты майданға оқ жасайтын қорғасынның өте үлкен бөлігін</div></div>
<div id="cap220" class="clip cap ca" data-start="963.551" data-duration="0.751" data-track-index="2"><div class="cap-in"><b>Ата:</b> берді.</div></div>
<div id="cap221" class="clip cap ce" data-start="972.602" data-duration="3.067" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, хабарсыз кеткен сарбаздар қайда жатыр?</div></div>

<div id="cap223" class="clip cap ca" data-start="981.339" data-duration="3.719" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ленинград маңындағы орман мен батпақта.</div></div>
<div id="cap224" class="clip cap ca" data-start="985.458" data-duration="3.477" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олардың көбі әлі күнге дейін жерленбей жатыр.</div></div>
<div id="cap225" class="clip cap ce" data-start="989.335" data-duration="2.748" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Қанша? Нақты саны белгілі ме?</div></div>
<div id="cap226" class="clip cap ca" data-start="993.183" data-duration="2.724" data-track-index="2"><div class="cap-in"><b>Ата:</b> Жоқ, балам. Нақты санын ешкім білмейді.</div></div>
<div id="cap227" class="clip cap ca" data-start="995.907" data-duration="5.029" data-track-index="2"><div class="cap-in"><b>Ата:</b> Хабарсыз кеткен екі жүз жетпіс бір мың адамның көбінің қайда жатқаны әлі</div></div>
<div id="cap228" class="clip cap ca" data-start="1000.936" data-duration="0.979" data-track-index="2"><div class="cap-in"><b>Ата:</b> белгісіз.</div></div>
<div id="cap229" class="clip cap ca" data-start="1003.015" data-duration="1.338" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бірақ іздеушілер бар.</div></div>
<div id="cap230" class="clip cap ca" data-start="1004.353" data-duration="4.013" data-track-index="2"><div class="cap-in"><b>Ата:</b> Қазақстан мен Ресейдің іздеу отрядтары жыл сайын орманға барып,</div></div>
<div id="cap231" class="clip cap ca" data-start="1008.365" data-duration="1.624" data-track-index="2"><div class="cap-in"><b>Ата:</b> сарбаздарды іздейді.</div></div>
<div id="cap232" class="clip cap ca" data-start="1010.389" data-duration="4.569" data-track-index="2"><div class="cap-in"><b>Ата:</b> Олар жерді абайлап қазып, сарбаздың сүйегін, медальонын, медалін,</div></div>
<div id="cap233" class="clip cap ca" data-start="1014.958" data-duration="1.405" data-track-index="2"><div class="cap-in"><b>Ата:</b> қасығын табады.</div></div>
<div id="cap234" class="clip cap ca" data-start="1017.463" data-duration="3.006" data-track-index="2"><div class="cap-in"><b>Ата:</b> Кейде медальонның ішінен кішкентай қағаз шығады.</div></div>
<div id="cap235" class="clip cap ca" data-start="1020.469" data-duration="3.419" data-track-index="2"><div class="cap-in"><b>Ата:</b> Онда сарбаздың аты-жөні мен туған ауылы жазылған.</div></div>
<div id="cap236" class="clip cap ca" data-start="1024.288" data-duration="1.770" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сол арқылы туыстары табылады.</div></div>
<div id="cap237" class="clip cap ca" data-start="1026.058" data-duration="4.072" data-track-index="2"><div class="cap-in"><b>Ата:</b> Сексен жылдан кейін отбасы өз атасының қайда жатқанын біледі.</div></div>
<div id="cap238" class="clip cap ca" data-start="1031.230" data-duration="2.888" data-track-index="2"><div class="cap-in"><b>Ата:</b> Кейбір сарбаздардың сүйегі туған жеріне әкелініп,</div></div>
<div id="cap239" class="clip cap ca" data-start="1034.118" data-duration="2.295" data-track-index="2"><div class="cap-in"><b>Ата:</b> әскери құрметпен қайта жерленеді.</div></div>
<div id="cap240" class="clip cap ce" data-start="1036.813" data-duration="2.753" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, біздің бабамызды да табуға бола ма?</div></div>
<div id="cap241" class="clip cap ca" data-start="1040.666" data-duration="0.523" data-track-index="2"><div class="cap-in"><b>Ата:</b> Болады.</div></div>
<div id="cap242" class="clip cap ca" data-start="1041.189" data-duration="5.802" data-track-index="2"><div class="cap-in"><b>Ата:</b> Интернетте «Мемориал» деген деректер базасында атын жазып іздеуге болады.</div></div>
<div id="cap243" class="clip cap ca" data-start="1047.391" data-duration="4.219" data-track-index="2"><div class="cap-in"><b>Ата:</b> «Атамның аманаты» қоғамдық бірлестігі де адамдарға туыстарын іздеуге</div></div>
<div id="cap244" class="clip cap ca" data-start="1051.610" data-duration="1.095" data-track-index="2"><div class="cap-in"><b>Ата:</b> көмектеседі.</div></div>
<div id="cap245" class="clip cap ce" data-start="1053.105" data-duration="2.698" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Онда мен міндетті түрде іздеймін, ата.</div></div>
<div id="cap246" class="clip cap ce" data-start="1055.803" data-duration="2.267" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Бабамыздың атын ұмытпаймыз.</div></div>
<div id="cap247" class="clip cap ca" data-start="1066.370" data-duration="2.960" data-track-index="2"><div class="cap-in"><b>Ата:</b> Ал енді екі соғысты қатар қойып салыстырайық.</div></div>
<div id="cap248" class="clip cap ca" data-start="1070.430" data-duration="6.458" data-track-index="2"><div class="cap-in"><b>Ата:</b> Бірінші соғыс 1914 жылдан 1918 жылға дейін, төрт жылдан астам жүрді.</div></div>
<div id="cap249" class="clip cap ca" data-start="1076.888" data-duration="5.478" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екіншісі 1939 жылдан 1945 жылға дейін, алты жыл жүрді.</div></div>
<div id="cap250" class="clip cap ca" data-start="1083.466" data-duration="4.781" data-track-index="2"><div class="cap-in"><b>Ата:</b> Біріншісінде Антанта жеңді. Екіншісінде Одақтастар жеңді.</div></div>
<div id="cap251" class="clip cap ca" data-start="1089.347" data-duration="3.382" data-track-index="2"><div class="cap-in"><b>Ата:</b> Біріншісінде шамамен 15–22 миллион адам,</div></div>
<div id="cap252" class="clip cap ca" data-start="1092.729" data-duration="3.901" data-track-index="2"><div class="cap-in"><b>Ата:</b> екіншісінде 70–85 миллион адам қаза тапты.</div></div>
<div id="cap253" class="clip cap ca" data-start="1097.730" data-duration="2.389" data-track-index="2"><div class="cap-in"><b>Ата:</b> Біріншісінде көбіне сарбаздар өлді.</div></div>
<div id="cap254" class="clip cap ca" data-start="1100.119" data-duration="3.285" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екіншісінде көбіне бейбіт халық қаза тапты.</div></div>
<div id="cap255" class="clip cap ca" data-start="1104.504" data-duration="3.604" data-track-index="2"><div class="cap-in"><b>Ата:</b> Біріншісі — окоп соғысы, әскерлер бір орында тұрды.</div></div>
<div id="cap256" class="clip cap ca" data-start="1108.108" data-duration="3.318" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екіншісі — танк пен ұшақтың жылдам соғысы.</div></div>

<div id="cap260" class="clip cap ca" data-start="1124.084" data-duration="4.032" data-track-index="2"><div class="cap-in"><b>Ата:</b> Екіншісінде — майданға кеткен миллионнан астам адам.</div></div>
<div id="cap261" class="clip cap ce" data-start="1136.416" data-duration="4.199" data-track-index="2"><div class="cap-in"><b>Ерлан:</b> Ата, соғыс неге болады? Адамдар неге тоқтамайды?</div></div>
